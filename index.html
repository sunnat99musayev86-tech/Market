<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .score { font-size: 50px; font-weight: 900; margin-bottom: 20px; color: #f39c12; text-shadow: 0 0 20px rgba(243, 156, 18, 0.5); }
        
        /* Главная монета (товар) */
        .coin-container { position: relative; width: 250px; height: 250px; cursor: pointer; transition: transform 0.1s; }
        .coin-container:active { transform: scale(0.95); }
        .coin { width: 100%; height: 100%; border-radius: 50%; background: url('1.jpg') center/cover; border: 8px solid #f39c12; box-shadow: 0 0 50px rgba(243, 156, 18, 0.3); display: flex; align-items: center; justify-content: center; font-size: 80px; }

        /* Летающий текст +1 */
        .tap-text { position: absolute; color: #f39c12; font-size: 30px; font-weight: bold; animation: flyUp 1s forwards; pointer-events: none; }
        @keyframes flyUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-200px); } }

        .footer { position: fixed; bottom: 50px; width: 100%; font-size: 18px; opacity: 0.7; }
        .energy-bar { width: 80%; height: 10px; background: #333; border-radius: 5px; margin: 10px auto; overflow: hidden; }
        .energy-fill { width: 100%; height: 100%; background: #f39c12; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="score" id="score">0</div>
    
    <div class="coin-container" onclick="handleTap(event)">
        <div class="coin" id="coin-img">🥖</div>
    </div>

    <div class="footer">
        <div>⚡ <span id="energy">1000</span> / 1000</div>
        <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    tg.headerColor = '#000000';

    let count = 0;
    let energy = 1000;

    function handleTap(event) {
        if (energy <= 0) return;

        // 1. Увеличиваем счет
        count++;
        energy -= 5;
        document.getElementById('score').innerText = count;
        document.getElementById('energy').innerText = energy;
        document.getElementById('energy-fill').style.width = (energy/10) + '%';

        // 2. Вибрация как в Notcoin
        tg.HapticFeedback.impactOccurred('medium');

        // 3. Создаем эффект "+1" в месте клика
        const text = document.createElement('div');
        text.className = 'tap-text';
        text.innerText = '+1';
        text.style.left = event.clientX - 20 + 'px';
        text.style.top = event.clientY - 50 + 'px';
        document.body.appendChild(text);

        // Удаляем текст через секунду
        setTimeout(() => text.remove(), 1000);

        // 4. Отправляем данные боту (но НЕ закрываем приложение)
        // В Notcoin данные копятся и отправляются пачками.
        if (count % 10 === 0) {
            // Можно отправить "промежуточный" результат
            console.log("Отправка данных на сервер...");
        }
    }
</script>
</body>
</html>
