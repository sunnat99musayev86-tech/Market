<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --danger: #ff3b30; --success: #4cd964; --accent: #ff9500; }
        body { font-family: -apple-system, sans-serif; background: #f0f0f2; margin: 0; padding: 0; color: #1c1c1e; }
        .header { background: #000; color: #fff; padding: 25px 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .urgent-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .container { padding: 15px; }
        .card { background: #fff; border-radius: 18px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        .img-box { width: 90px; height: 90px; border-radius: 12px; overflow: hidden; background: #eee; flex-shrink: 0; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { flex: 1; }
        .info h3 { margin: 0; font-size: 16px; }
        .stock { color: var(--danger); font-size: 12px; font-weight: bold; margin-top: 4px; }
        .prices { margin-top: 5px; }
        .price { color: #000; font-size: 19px; font-weight: 800; }
        .old-price { text-decoration: line-through; color: #8e8e93; font-size: 13px; margin-left: 5px; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 12px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 8px rgba(255,149,0,0.2); }
    </style>
</head>
<body>
    <div class="header">
        <span class="urgent-badge">СРОЧНЫЕ СКИДКИ</span>
        <h1 style="margin: 10px 0 0; font-size: 24px;">TV DISCOUNT</h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="img-box"><img src="1.jpg" alt="Лепешка"></div>
            <div class="info">
                <h3>Горячая Лепёшка</h3>
                <div class="stock">Осталось: 8 шт.</div>
                <div class="prices">
                    <span class="price">1 500</span><span class="old-price">4 000</span>
                </div>
            </div>
            <button onclick="order('Лепешка')">БРОНЬ</button>
        </div>

        <div class="card">
            <div class="img-box"><img src="2.jpg" alt="Молоко"></div>
            <div class="info">
                <h3>Молоко Мусаффо</h3>
                <div class="stock">Срок до: завтра!</div>
                <div class="prices">
                    <span class="price">4 500</span><span class="old-price">12 500</span>
                </div>
            </div>
            <button onclick="order('Молоко')">БРОНЬ</button>
        </div>

        </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function order(name) {
            tg.HapticFeedback.notificationOccurred('success');
            tg.sendData("СРОЧНЫЙ ЗАКАЗ: " + name);
            tg.close();
        }
    </script>
</body>
</html>
